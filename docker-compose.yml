# =============================================================================
# GymManager — ambiente completo (GYM-IAC-001)
# Responsável: DBA/DevOps (João Vitor Simonetti)
#
#   cp .env.example .env        # e troque os valores "trocar-..."
#   docker compose up --build
#
#   Interface: http://localhost:${FRONTEND_PORTA:-8080}
#   API:       http://localhost:${FRONTEND_PORTA:-8080}/api/v1
# =============================================================================
name: gymmanager

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    ports:
      - "${MYSQL_PORTA_HOST:-3316}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: codigo-fonte/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORTA:-5000}:5000"

  frontend:
    build:
      context: codigo-fonte/frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORTA:-8080}:80"

volumes:
  mysql-data:
